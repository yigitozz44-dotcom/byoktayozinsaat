<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">

<title>BY OKTAYÖZ Inbox</title>
<link rel="icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=Oswald:wght@400;500&display=swap">
<style>
:root{--blue:#006CA7;--blue-lt:#6FAED6;--ink:#2B3330;--deep:#1D2321;--mist:#F3F5F4;--paper:#FAFBFA;--line:#DDE3E0;--muted:#6B7470;--red:#B3261E;--amber:#A86B00;--green:#2E7D4F;
  --f:"Jost",system-ui,-apple-system,"Segoe UI",sans-serif;--fm:"Oswald","Arial Narrow",sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--mist);color:var(--ink);font:300 16px/1.55 var(--f);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
[hidden]{display:none!important}
.eyebrow{font:400 12px/1 var(--f);letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 20px;border:1px solid var(--deep);background:var(--deep);color:#fff;font-size:13px;letter-spacing:.18em;text-transform:uppercase;cursor:pointer;border-radius:2px;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--ink)}
.btn.sm{height:36px;padding:0 14px;font-size:12px}
.btn.danger{background:transparent;color:var(--red);border-color:var(--red)}
.btn:disabled{opacity:.45;cursor:default}
/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-left,0px))}
.login form{width:min(420px,100%);background:var(--paper);border:1px solid var(--line);padding:44px 36px;display:grid;gap:20px}
.login svg.lg{width:170px;height:51px;--logo-ink:#2B3330}
.login h1{margin:6px 0 0;font:400 30px/1.1 var(--f);color:var(--blue);letter-spacing:-.5px}
.field{display:grid;gap:8px}
.field input{height:48px;border:1px solid var(--line);background:#fff;padding:0 14px;border-radius:2px;font-size:16px}
.field input:focus,textarea:focus,select:focus{outline:2px solid var(--blue-lt);outline-offset:1px}
.err{color:var(--red);font-size:14px;min-height:1em;margin:0}
.remember{display:flex;gap:10px;align-items:center;font-size:14px;color:var(--muted)}
/* shell */
.top{position:sticky;top:0;z-index:20;background:var(--deep);color:#fff;display:flex;align-items:center;gap:16px;padding:0 max(20px,env(safe-area-inset-right,0px)) 0 max(20px,env(safe-area-inset-left,0px));height:72px}
.top svg.lg{width:140px;height:42px;--logo-ink:#fff;flex:none}
.tag{border:1px solid rgba(255,255,255,.7);padding:5px 9px 4px;font-size:11px;letter-spacing:.24em}
.top .sp{flex:1}
.top a,.top button.link{color:#fff;text-decoration:none;font-size:12px;letter-spacing:.2em;text-transform:uppercase;background:none;border:0;cursor:pointer;padding:8px 4px}
.top .menu{display:none;background:none;border:0;color:#fff;font-size:26px;cursor:pointer;padding:4px 8px}
.shell{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:calc(100vh - 72px)}
.side{background:var(--paper);border-right:1px solid var(--line);padding:22px 0}
.side h6{margin:22px 28px 8px;font:400 11px/1 var(--f);letter-spacing:.24em;color:var(--muted);text-transform:uppercase}
.side button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-left:3px solid transparent;padding:12px 25px;font-size:19px;cursor:pointer}
.side button small{font-size:11px;color:var(--muted);width:18px}
.side button .n{margin-left:auto;min-width:22px;height:22px;border-radius:11px;background:var(--blue);color:#fff;font-size:12px;display:grid;place-items:center;padding:0 6px}
.side button.on{background:var(--mist);border-left-color:var(--blue)}
main{padding:36px max(20px,env(safe-area-inset-right,0px)) 60px max(20px,3vw);min-width:0}
.hd{display:flex;flex-wrap:wrap;align-items:flex-end;gap:16px;justify-content:space-between;margin-bottom:28px}
.hd h2{margin:10px 0 0;font:300 clamp(32px,3.6vw,48px)/1.05 var(--f);letter-spacing:-1px;color:var(--blue)}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:22px}
.card{background:var(--paper);border:1px solid var(--line);padding:22px 22px 18px}
.card b{display:block;font:400 clamp(30px,3vw,42px)/1 var(--fm);color:var(--ink)}
.card span{display:block;margin-top:10px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.card.hl b{color:var(--blue)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.box{background:var(--paper);border:1px solid var(--line);padding:26px 26px 14px;min-width:0}
.box h3{margin:0;font:400 24px/1.2 var(--f);color:var(--blue)}
.box p.sub{margin:4px 0 14px;color:var(--muted);font-size:14px}
.empty{padding:34px 10px;text-align:center;color:var(--muted)}
.rows{display:grid}
.row{display:grid;grid-template-columns:110px minmax(0,1.4fr) minmax(0,1.3fr) 32px 120px;gap:14px;align-items:center;padding:14px 4px;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.row:hover{background:var(--mist)}
.row .d{font-size:13px;color:var(--muted)}
.row .nm{font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .sb{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px}
.row .cl{font-size:15px;color:var(--muted);text-align:center}
.box.compact .row{grid-template-columns:90px minmax(0,1fr) 110px}
.box.compact .row .sb,.box.compact .row .cl{display:none}
.pill{justify-self:end;font-size:11px;letter-spacing:.14em;text-transform:uppercase;padding:5px 9px 4px;border-radius:20px;border:1px solid currentColor;white-space:nowrap}
.pill.yeni{color:var(--blue);background:#E6F1F8;border-color:#BCD9EC}
.pill.inceleniyor{color:var(--amber);background:#FBF3E4;border-color:#EBD3A6}
.pill.donus{color:var(--green);background:#E8F3EC;border-color:#BFDCC9}
.pill.arsiv{color:var(--muted);background:#EEF0EF;border-color:var(--line)}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
.chip{height:36px;padding:0 14px;border:1px solid var(--line);background:#fff;border-radius:18px;cursor:pointer;font-size:14px}
.chip.on{background:var(--deep);color:#fff;border-color:var(--deep)}
.tools input{height:38px;border:1px solid var(--line);background:#fff;padding:0 12px;min-width:0;flex:1 1 220px;max-width:340px;border-radius:2px}
.tools .sp{flex:1}
/* drawer */
.veil{position:fixed;inset:0;background:rgba(17,22,21,.5);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--paper);z-index:41;overflow-y:auto;padding:28px max(20px,env(safe-area-inset-right,0px)) 40px 32px;box-shadow:-20px 0 60px rgba(0,0,0,.15)}
.drawer .x{position:absolute;top:16px;right:18px;background:none;border:0;font-size:30px;cursor:pointer;line-height:1}
.drawer h3{margin:10px 0 4px;font:300 34px/1.1 var(--f);color:var(--blue);letter-spacing:-.6px;padding-right:40px}
.drawer .when{color:var(--muted);font-size:14px;margin:0 0 22px}
dl.kv{margin:0 0 24px;border-top:1px solid var(--line)}
dl.kv div{display:grid;grid-template-columns:140px minmax(0,1fr);gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
dl.kv dt{color:var(--muted);font-size:14px}
dl.kv dd{margin:0;white-space:pre-wrap;word-break:break-word}
dl.kv dd a{color:var(--blue)}
.copy{margin-left:8px;font-size:12px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:2px 9px;cursor:pointer}
.sec{margin:24px 0 10px}
.files{display:flex;flex-wrap:wrap;gap:8px}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{height:38px;padding:0 14px;border:1px solid var(--line);background:#fff;border-radius:2px;cursor:pointer;font-size:14px}
.seg button.on{background:var(--deep);color:#fff;border-color:var(--deep)}
textarea{width:100%;min-height:110px;border:1px solid var(--line);background:#fff;padding:12px;border-radius:2px;resize:vertical}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:16px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--deep);color:#fff;padding:12px 18px;border-radius:2px;z-index:60;font-size:15px}

.hd-act{display:flex;gap:10px;align-items:center}
#csave.dirty{background:var(--blue);border-color:var(--blue)}
#csave.dirty::after{content:"";width:7px;height:7px;border-radius:50%;background:#FFD27A;margin-left:4px}
.box+.box{margin-top:16px}
.bh{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:12px}
.sec-in{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.sec-in input{width:76px;height:38px;border:1px solid var(--line);background:#fff;padding:0 10px;font-size:16px;border-radius:2px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;margin:6px 0 12px}
.mgrid.one{grid-template-columns:minmax(0,260px)}
.mrow{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.mrow .mgrid.one{grid-template-columns:1fr;margin:0}
.mitem{margin:0;background:#fff;border:1px solid var(--line);display:grid;gap:8px;padding:8px}
.mitem figcaption{font-size:14px;color:var(--muted);padding:0 2px}
.mimg{position:relative;aspect-ratio:4/3;background:var(--mist);overflow:hidden}
.mimg img{width:100%;height:100%;object-fit:cover;display:block}
.mno{position:absolute;left:6px;top:6px;background:rgba(29,35,33,.75);color:#fff;font-size:12px;padding:2px 7px;border-radius:10px}
.mx{position:absolute;right:6px;top:6px;width:28px;height:28px;border-radius:50%;border:0;background:var(--red);color:#fff;font-size:17px;line-height:28px;cursor:pointer;padding:0}
.mx.sure{width:auto;padding:0 10px;border-radius:14px;font-size:12px}
.mcap{height:36px;border:1px solid var(--line);padding:0 10px;font-size:14px;border-radius:2px;width:100%;min-width:0}
.mmv{display:flex;gap:6px}
.mmv button{height:32px;min-width:34px;padding:0 10px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:13px;border-radius:2px}
.mmv button:last-child{margin-left:auto}
.mmv button:disabled{opacity:.35;cursor:default}
.madd{min-height:150px;border:2px dashed var(--blue-lt);background:rgba(111,174,214,.08);color:var(--blue);font-size:16px;cursor:pointer;border-radius:2px}
.madd:hover{border-color:var(--blue)}
.note{font-size:13px;color:var(--muted);margin:6px 0 4px}
.note code{background:var(--mist);padding:1px 5px;border-radius:3px;color:var(--ink)}
.vnew{display:grid;grid-template-columns:2fr 2fr 1.3fr 150px 100px auto;gap:10px}
.vnew input,.vrow input{height:40px;border:1px solid var(--line);background:#fff;padding:0 10px;font-size:15px;border-radius:2px;min-width:0;width:100%}
.vlist{display:grid}
.vrow{position:relative;display:grid;grid-template-columns:150px minmax(0,2.4fr) minmax(0,1.2fr) 150px 90px 40px;gap:12px;align-items:end;padding:14px 0;border-top:1px solid var(--line)}
.vrow label{display:grid;gap:4px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);min-width:0}
.vth{display:block;aspect-ratio:16/9;background:var(--mist);overflow:hidden}
.vth img{width:100%;height:100%;object-fit:cover;display:block}
.vrow .mx{position:static;align-self:center}
.banner{padding:14px 18px;margin-bottom:16px;border-radius:2px;font-size:15px}
.banner.ok{background:#E8F3EC;color:var(--green);border:1px solid #BFDCC9}
.banner.warn{background:#FBF3E4;color:var(--amber);border:1px solid #EBD3A6}
.tg{display:flex;align-items:center;gap:10px;font-size:15px;margin:0 0 14px;cursor:pointer}
.argrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:16px;align-items:start}
.argrid .box+.box{margin-top:0}
.argrid .field{margin-bottom:14px}
.argrid .field input{height:44px}
.argrid textarea{min-height:240px;font-size:15px;line-height:1.6}
.seg.sm button{height:32px;padding:0 12px}
.pv iframe{width:100%;height:760px;border:1px solid var(--line);background:#EEF1F0}
@media (max-width:1100px){.argrid{grid-template-columns:1fr}.vnew{grid-template-columns:1fr 1fr}.vrow{grid-template-columns:120px 1fr 1fr;align-items:start}.vrow .mx{position:absolute;right:0;top:14px}}
@media (max-width:1100px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:1fr}}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;top:72px;left:0;bottom:0;width:260px;z-index:30;transform:translateX(-100%);transition:transform .3s}
  body.nav .side{transform:none}
  .top .menu{display:block}
  .top .tag{display:none}
  .row{grid-template-columns:minmax(0,1fr) auto;gap:4px 12px}
  .row .d{grid-column:1/-1;order:-1}
  .row .sb{grid-column:1}
  .row .cl{display:none}
  .row .pill{grid-row:2/4;grid-column:2;align-self:center}
}
@media (max-width:520px){.top a.live span{display:none}.cards{gap:10px}.card{padding:16px}dl.kv div{grid-template-columns:1fr;gap:2px}}
</style>
</head>

<script>
const API=(new URLSearchParams(location.search).get("api"))||"https://byoktayoz-api.yigitozz44.workers.dev";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const TYPE={teklif:"Teklifler",iletisim:"İletişim mesajları",bilgi:"Proje bilgi talepleri"};
const TYPE1={teklif:"Teklif",iletisim:"İletişim mesajı",bilgi:"Proje bilgi talebi"};
const ST={yeni:"Yeni",inceleniyor:"İnceleniyor",donus:"Dönüş yapıldı",arsiv:"Arşiv"};
const LBL={title:"Hitap",name:"Ad soyad",email:"E-posta",phone:"Telefon",location:"Arsa / proje konumu",offerType:"Teklif türü",topic:"Konu",project:"Proje",message:"Mesaj",channels:"İletişim izinleri",lang:"Dil",page:"Gönderildiği sayfa"};
let PW="",ITEMS=[],VIEW="panel",FILTER="hepsi",Q="";
const store={get(k){try{return localStorage.getItem(k)||sessionStorage.getItem(k)}catch(e){return null}},set(k,v,keep){try{(keep?localStorage:sessionStorage).setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k);sessionStorage.removeItem(k)}catch(e){}}};
function toast(t){const e=$("#toast");e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,2600)}
async function api(path,opt={}){
  const r=await fetch(API+path,{...opt,headers:{...(opt.headers||{}),Authorization:"Bearer "+PW}});
  if(r.status===401){logout();throw new Error("auth")}
  return r;
}
const fmt=iso=>{const d=new Date(iso);return d.toLocaleDateString("tr-TR",{day:"2-digit",month:"2-digit",year:"numeric"})};
const fmtLong=iso=>new Date(iso).toLocaleString("tr-TR",{day:"numeric",month:"long",year:"numeric",hour:"2-digit",minute:"2-digit"});

/* giriş */
$("#loginForm").addEventListener("submit",async e=>{e.preventDefault();const pw=$("#pw").value;$("#loginErr").textContent="";$("#loginBtn").disabled=true;
  try{const r=await fetch(API+"/ping",{headers:{Authorization:"Bearer "+pw}});
    if(r.ok){PW=pw;store.set("bo_admin",pw,$("#remember").checked);start()}else $("#loginErr").textContent=r.status===401?"Şifre hatalı.":"Sunucuya ulaşılamadı ("+r.status+").";
  }catch(err){$("#loginErr").textContent="Sunucuya ulaşılamadı. İnternet bağlantınızı kontrol edin."}
  $("#loginBtn").disabled=false});
function logout(){PW="";store.del("bo_admin");$("#app").hidden=true;$("#login").hidden=false;closeDrawer();$("#pw").value=""}
$("#logout").addEventListener("click",logout);
$("#menuBtn").addEventListener("click",()=>document.body.classList.toggle("nav"));

/* veri */
async function load(){try{const r=await api("/list");const j=await r.json();ITEMS=(j.items||[]).sort((a,b)=>a.id<b.id?-1:1);counts();if(!CVIEWS[VIEW])render()}catch(e){if(e.message!=="auth")toast("Kayıtlar yüklenemedi")}}
function counts(){for(const t of ["teklif","iletisim","bilgi"]){const n=ITEMS.filter(i=>i.type===t&&i.status==="yeni").length;const el=$("#n-"+t);el.textContent=n;el.hidden=!n}}
function rowHTML(i){return `<button class="row" data-id="${i.id}"><span class="d">${fmt(i.at)}</span><span class="nm">${esc(i.name||"—")}</span><span class="sb">${esc(i.sub||"")}</span><span class="cl" title="Ek dosya">${i.files?"📎":""}</span><span class="pill ${i.status}">${ST[i.status]||i.status}</span></button>`}

function render(){
  document.querySelectorAll("#side button").forEach(b=>b.classList.toggle("on",b.dataset.v===VIEW));
  if(typeof CVIEWS!=="undefined"&&CVIEWS[VIEW])return renderContent(VIEW);
  const m=$("#main");
  if(VIEW==="panel"){
    const h=new Date().getHours(),g=h<6?"İyi geceler":h<12?"Günaydın":h<18?"İyi günler":"İyi akşamlar";
    const now=Date.now(),d30=ITEMS.filter(i=>now-new Date(i.at)<30*864e5).length;
    const nt=ITEMS.filter(i=>i.type==="teklif"),newT=nt.filter(i=>i.status==="yeni").length;
    const newM=ITEMS.filter(i=>i.type!=="teklif"&&i.status==="yeni").length;
    const waiting=ITEMS.filter(i=>i.status==="yeni").slice(0,6),latest=ITEMS.slice(0,6);
    m.innerHTML=`<div class="hd"><div><span class="eyebrow">${new Date().toLocaleDateString("tr-TR",{day:"numeric",month:"long",year:"numeric",weekday:"long"})}</span><h2>${g}</h2></div><button class="btn ghost sm" id="refresh">Yenile</button></div>
    <div class="cards"><div class="card hl"><b>${newT}</b><span>Yeni teklif</span></div><div class="card"><b>${nt.length}</b><span>Toplam teklif</span></div><div class="card hl"><b>${newM}</b><span>Yeni mesaj ve talep</span></div><div class="card"><b>${d30}</b><span>Son 30 günde gelen</span></div></div>
    <div class="grid2"><div class="box compact"><h3>Dikkatinizi bekleyenler</h3><p class="sub">Henüz bakılmamış kayıtlar.</p><div class="rows">${waiting.map(rowHTML).join("")||'<div class="empty">Her şey yolunda. Bekleyen bir şey yok.</div>'}</div></div>

  }else{
    const all=ITEMS.filter(i=>i.type===VIEW);
    const q=Q.toLocaleLowerCase("tr");
    const rows=all.filter(i=>(FILTER==="hepsi"||i.status===FILTER)&&(!q||(i.name+" "+(i.sub||"")).toLocaleLowerCase("tr").includes(q)));
    const chips=[["hepsi","Tümü"],...Object.entries(ST)].map(([k,v])=>`<button class="chip${FILTER===k?" on":""}" data-f="${k}">${v} <small>(${k==="hepsi"?all.length:all.filter(i=>i.status===k).length})</small></button>`).join("");

    <div class="box"><div class="rows">${rows.map(rowHTML).join("")||'<div class="empty">Bu görünümde kayıt yok.</div>'}</div></div>`;
    const qi=$("#q");qi.addEventListener("input",()=>{Q=qi.value;const p=qi.selectionStart;render();const n=$("#q");n.focus();n.setSelectionRange(p,p)});
  }
  $("#refresh")&&$("#refresh").addEventListener("click",()=>{load();toast("Güncellendi")});
}
$("#main").addEventListener("click",e=>{if(CVIEWS[VIEW])return;const c=e.target.closest(".chip");if(c){FILTER=c.dataset.f;render();return}const r=e.target.closest(".row");if(r)open(r.dataset.id)});

/* detay */
let CUR=null;
async function open(id){
  try{const r=await api("/item/"+id);const j=await r.json();if(!j.ok)return toast("Kayıt bulunamadı");CUR=j.item;drawer()}catch(e){}
}
function drawer(){
  const it=CUR,d=it.data||{};
  const rows=Object.keys(LBL).filter(k=>d[k]).map(k=>{let v=esc(d[k]);
    if(k==="email")v=`<a href="mailto:${esc(d[k])}">${v}</a><button class="copy" data-c="${esc(d[k])}">Kopyala</button>`;
    if(k==="phone")v=`<a href="tel:${esc(d[k].replace(/[^\d+]/g,""))}">${v}</a><button class="copy" data-c="${esc(d[k])}">Kopyala</button>`;
    if(k==="lang")v=d[k]==="en"?"İngilizce":"Türkçe";
    return `<div><dt>${LBL[k]}</dt><dd>${v}</dd></div>`}).join("");
  const files=(it.files||[]).map(f=>`<button class="btn ghost sm" data-file="${f.n}">${esc(f.name)} · ${(f.size/1024/1024).toFixed(1)} MB</button>`).join("");
  $("#drawer").innerHTML=`<button class="x" id="dx" aria-label="Kapat">×</button>
    <span class="eyebrow">${TYPE1[it.type]||""}</span><h3>${esc(d.name||"—")}</h3><p class="when">${fmtLong(it.at)}</p>
    <dl class="kv">${rows}</dl>
    ${files?`<div class="sec eyebrow">Ekler</div><div class="files">${files}</div>`:""}
    <div class="sec eyebrow">Durum</div><div class="seg" id="seg">${Object.entries(ST).map(([k,v])=>`<button data-s="${k}" class="${it.status===k?"on":""}">${v}</button>`).join("")}</div>
    <div class="sec eyebrow">İç not</div><textarea id="note" placeholder="Görüşme notları, kime yönlendirildiği vb. Sadece panelde görünür.">${esc(it.note||"")}</textarea>
    <div class="actions"><button class="btn" id="save">Kaydet</button><span style="flex:1"></span><button class="btn danger sm" id="del">Sil</button></div>`;
  $("#drawer").hidden=false;$("#veil").hidden=false;
}
function closeDrawer(){$("#drawer").hidden=true;$("#veil").hidden=true;CUR=null}
$("#veil").addEventListener("click",closeDrawer);
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&CUR)closeDrawer()});
$("#drawer").addEventListener("click",async e=>{
  const t=e.target;
  if(t.id==="dx")return closeDrawer();
  if(t.dataset.c){try{await navigator.clipboard.writeText(t.dataset.c);toast("Kopyalandı")}catch(err){toast(t.dataset.c)}return}
  if(t.dataset.s){CUR.status=t.dataset.s;document.querySelectorAll("#seg button").forEach(b=>b.classList.toggle("on",b===t));return}
  if(t.dataset.file!==undefined){const w=window.open("","_blank");try{const r=await api(`/file/${CUR.id}/${t.dataset.file}`);const b=await r.blob();const u=URL.createObjectURL(b);if(w)w.location=u;else location.href=u}catch(err){w&&w.close();toast("Dosya açılamadı")}return}
  if(t.id==="save"){t.disabled=true;try{const r=await api("/item/"+CUR.id,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({status:CUR.status,note:$("#note").value})});if(r.ok){toast("Kaydedildi");closeDrawer();load()}else toast("Kaydedilemedi")}catch(err){}t.disabled=false;return}
  if(t.id==="del"){if(t.dataset.sure!=="1"){t.dataset.sure="1";t.textContent="Emin misiniz? Tekrar basın";return}
    try{const r=await api("/item/"+CUR.id,{method:"DELETE"});if(r.ok){toast("Silindi");closeDrawer();load()}}catch(err){}}
});

function pickFiles(multi){return new Promise(res=>{const i=document.createElement("input");i.type="file";i.accept="image/*";i.multiple=!!multi;i.onchange=()=>res([...i.files]);i.click()})}
async function shrink(file,max=2400){
  const url=URL.createObjectURL(file);
  try{const img=await new Promise((ok,no)=>{const im=new Image();im.onload=()=>ok(im);im.onerror=no;im.src=url});
    const k=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement("canvas");c.width=Math.round(img.naturalWidth*k);c.height=Math.round(img.naturalHeight*k);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);return await new Promise(ok=>c.toBlob(ok,"image/jpeg",.86))}
  finally{URL.revokeObjectURL(url)}
}
async function upload(files){
  const out=[];
  for(const [n,f] of files.entries()){
    toast(`Yükleniyor ${n+1}/${files.length}…`);
    try{const b=await shrink(f);const r=await api("/img",{method:"POST",headers:{"Content-Type":"image/jpeg"},body:b});const j=await r.json();if(j.ok)out.push(j.url);else toast("Yüklenemedi: "+f.name)}catch(e){if(e.message!=="auth")toast("Yüklenemedi: "+f.name)}
  }
  if(out.length)toast(`${out.length} fotoğraf eklendi. Kaydet'e basmayı unutmayın.`);
  return out;
}

  if(t.dataset.al){ALANG=t.dataset.al;viewAuto();return true}

  if(t.id==="ar-test"){t.disabled=true;try{const d={...SAMPLE[ATAB],lang:ALANG};const r=await api("/test-mail",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({subject:"[Deneme] "+mailFill(LT2(AR[ATAB].subject,ALANG),d),html:previewHTML()})});const j=await r.json();toast(j.ok?"Deneme e-postası info@byoktayozinsaat.com adresine gönderildi":"Gönderilemedi")}catch(err){}t.disabled=false;return true}
  return false;
}

/* ---------- bağlama ---------- */
const CVIEWS={gorsel:viewMedia,basin:viewVideos,yanit:viewAuto};
async function renderContent(v){$("#main").innerHTML='<div class="empty">Yükleniyor…</div>';await loadContent();CVIEWS[v]()}
$("#main").addEventListener("click",async e=>{
  if(!CVIEWS[VIEW])return;
  const b=e.target.closest("button");if(!b)return;
  if(b.id==="csave"){saveContent(b.dataset.part);return}
  e.target=b;const ev={target:b};
  if(VIEW==="gorsel")await mediaClick(ev);else if(VIEW==="basin")await videoClick(ev);else await autoClick(ev);
});
$("#main").addEventListener("input",e=>{if(VIEW==="gorsel")mediaInput(e);else if(VIEW==="basin")videoInput(e);else if(VIEW==="yanit")autoInput(e)});
$("#main").addEventListener("change",e=>{if(VIEW==="yanit"&&e.target.type==="checkbox")autoInput(e)});

function start(){$("#login").hidden=true;$("#app").hidden=false;VIEW="panel";render();load();api("/ping").then(r=>r.json()).then(j=>{MAILON=!!j.mail}).catch(()=>{});clearInterval(start.t);start.t=setInterval(()=>{if(!CUR)load()},60000)}
PW=store.get("bo_admin")||"";
if(PW){fetch(API+"/ping",{headers:{Authorization:"Bearer "+PW}}).then(r=>r.ok?start():logout()).catch(()=>start())}else{$("#login").hidden=false}
</script>
